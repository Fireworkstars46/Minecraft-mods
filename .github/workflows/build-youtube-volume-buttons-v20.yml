name: Build YouTube Volume Buttons v2.0

on:
  push:
    branches:
      - youtube-volume-buttons-v20-samsung-native
  pull_request:
    paths:
      - 'youtube-volume-buttons-v20-source.zip'
      - '.github/workflows/build-youtube-volume-buttons-v20.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore source
        run: |
          unzip -t youtube-volume-buttons-v20-source.zip
          unzip -q youtube-volume-buttons-v20-source.zip
          test -f v20src/app/src/main/java/com/garrett/appvolumestepper/SamsungAppVolumeManager.java
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/' v20src/gradle.properties
          grep 'android.useAndroidX=true' v20src/gradle.properties

      - name: Build APK
        working-directory: v20src
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK and checksums
        run: |
          cp v20src/app/build/outputs/apk/debug/app-debug.apk YouTube-Volume-Buttons-v2.0.apk
          sha256sum YouTube-Volume-Buttons-v2.0.apk youtube-volume-buttons-v20-source.zip > YouTube-Volume-Buttons-v2.0-checksums.txt
          unzip -t YouTube-Volume-Buttons-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Volume-Buttons-v2.0
          path: |
            YouTube-Volume-Buttons-v2.0.apk
            YouTube-Volume-Buttons-v2.0-checksums.txt
            youtube-volume-buttons-v20-source.zip
