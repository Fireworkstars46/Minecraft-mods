name: Build App Volume Stepper

on:
  pull_request:
    paths:
      - 'app-volume-stepper-v14/**'
      - '.github/workflows/build-app-volume-stepper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: app-volume-stepper-v14
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug > build.log 2>&1
      - name: Prepare build outputs
        if: always()
        run: |
          if [ -f app-volume-stepper-v14/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app-volume-stepper-v14/app/build/outputs/apk/debug/app-debug.apk App-Volume-Stepper-v1.5.apk
          fi
          cp app-volume-stepper-v14/build.log app-volume-stepper-v1.5-build.log || true
      - name: Upload APK
        if: hashFiles('App-Volume-Stepper-v1.5.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: App-Volume-Stepper-v1.5
          path: App-Volume-Stepper-v1.5.apk
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-Volume-Stepper-v1.5-build-log
          path: app-volume-stepper-v1.5-build.log
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
