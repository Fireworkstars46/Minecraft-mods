name: Build App Volume Stepper

on:
  pull_request:
    paths:
      - 'app-volume-stepper-v14/**'
      - '.github/workflows/build-app-volume-stepper.yml'
  push:
    branches:
      - app-volume-stepper-v14-build
    paths:
      - 'app-volume-stepper-v14/**'
      - '.github/workflows/build-app-volume-stepper.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: app-volume-stepper-v14
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app-volume-stepper-v14/app/build/outputs/apk/debug/app-debug.apk App-Volume-Stepper-v1.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: App-Volume-Stepper-v1.4
          path: App-Volume-Stepper-v1.4.apk
