name: Build App Volume Buttons Migration v2

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app-volume-buttons-v24-source.b64'
      - '.github/workflows/build-avb-migration-v2.yml'

jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore v2.4 source
        run: |
          base64 -d app-volume-buttons-v24-source.b64 > source.zip
          mkdir final24
          unzip -q source.zip -d final24
      - name: Build final APK
        working-directory: final24
        run: gradle --no-daemon assembleRelease
      - name: Collect tools and APK
        run: |
          mkdir out
          cp final24/app/build/outputs/apk/release/app-release-unsigned.apk out/App-Volume-Buttons-v2.4-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" out/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/zipalign
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: avb-v24-unsigned-and-tools
          path: out/
