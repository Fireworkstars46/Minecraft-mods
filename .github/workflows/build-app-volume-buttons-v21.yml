name: Build App Volume Buttons v2.1

on:
  pull_request:
    paths:
      - 'v21src/**'
      - '.github/workflows/build-app-volume-buttons-v21.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source
        run: |
          test -f v21src/app/src/main/java/com/garrett/appvolumestepper/VolumeKeyService.java
          test -f v21src/app/src/main/java/com/garrett/appvolumestepper/SamsungAppVolumeManager.java

      - name: Build unsigned release APK
        working-directory: v21src
        run: gradle --no-daemon assembleRelease

      - name: Prepare artifact and signer
        run: |
          cp v21src/app/build/outputs/apk/release/app-release-unsigned.apk App-Volume-Buttons-v2.1-unsigned.apk
          unzip -t App-Volume-Buttons-v2.1-unsigned.apk
          sha256sum App-Volume-Buttons-v2.1-unsigned.apk > App-Volume-Buttons-v2.1-unsigned-checksum.txt
          mkdir -p signer/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signer/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signer/lib/apksigner.jar
          chmod +x signer/apksigner

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Volume-Buttons-v2.1-unsigned
          path: |
            App-Volume-Buttons-v2.1-unsigned.apk
            App-Volume-Buttons-v2.1-unsigned-checksum.txt
            signer/
