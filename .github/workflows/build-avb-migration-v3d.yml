name: Build App Volume Buttons Migration v3d

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-avb-migration-v3d.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate fixed migration helper source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source_workflow = Path('.github/workflows/build-avb-migration-v3.yml').read_text()
          start = "      - name: Create migration helper source\n        run: |\n"
          end = "      - name: Build helper\n"
          block = source_workflow.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/create-migration3.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/create-migration3.sh
          python3 - <<'PY'
          from pathlib import Path

          # Use a new temporary package so an older frozen migration helper cannot block installation.
          b = Path('migration3/app/build.gradle')
          s = b.read_text()
          s = s.replace("applicationId 'com.garrett.appvolumemigrator'", "applicationId 'com.garrett.appvolumemigrator3'")
          b.write_text(s)

          # Because applicationId differs from the Java namespace, launcher/target Activity names
          # must be fully qualified or Android will look in the wrong package at runtime.
          manifest = Path('migration3/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:name=".MigrationActivity"', 'android:name="com.garrett.appvolumemigrator.MigrationActivity"')
          s = s.replace('android:targetActivity=".MigrationActivity"', 'android:targetActivity="com.garrett.appvolumemigrator.MigrationActivity"')
          manifest.write_text(s)

          # Keep the retry helper visible until migration succeeds; never launch Settings automatically.
          m = Path('migration3/app/src/main/java/com/garrett/appvolumemigrator/MigrationActivity.java')
          s = m.read_text()
          s = s.replace('hideHelperLauncherIcon();', '')
          s = s.replace(
              'new ComponentName("com.garrett.appvolumemigrator", ShellUserService.class.getName())',
              'new ComponentName("com.garrett.appvolumemigrator3", ShellUserService.class.getName())'
          )
          m.write_text(s)

          # Self-clean the new helper and also remove the old frozen helper after success.
          sh = Path('migration3/app/src/main/java/com/garrett/appvolumemigrator/ShellUserService.java')
          s = sh.read_text()
          s = s.replace(
              'private static final String HELPER_PACKAGE="com.garrett.appvolumemigrator";',
              'private static final String HELPER_PACKAGE="com.garrett.appvolumemigrator3";\n              private static final String OLD_HELPER_PACKAGE="com.garrett.appvolumemigrator";'
          )
          needle = 'private void cleanupHelperLater() {'
          if needle not in s:
              raise SystemExit('cleanup method not found')
          insert = '''private void cleanupHelperLater() {\n                  try { Runtime.getRuntime().exec(new String[]{"sh","-c","pm uninstall "+OLD_HELPER_PACKAGE+" >/dev/null 2>&1 || true"}).waitFor(); }\n                  catch(Throwable ignored) { }'''
          s = s.replace(needle, insert, 1)
          sh.write_text(s)
          PY
      - name: Build helper
        working-directory: migration3
        run: gradle --no-daemon assembleRelease
      - name: Collect unsigned helper
        run: |
          mkdir out
          cp migration3/app/build/outputs/apk/release/app-release-unsigned.apk out/App-Volume-Buttons-Migration-Retry-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: avb-migration-retry-unsigned
          path: out/
