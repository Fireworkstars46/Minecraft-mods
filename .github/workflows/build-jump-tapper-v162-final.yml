name: Build Jump Tapper v1.62 Final
'on':
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Generate v1.62 rotation source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          doc=yaml.safe_load(Path('.github/workflows/build-jump-tapper-v162.yml').read_text())
          for name in ['Generate v1.61 source','Patch v1.62 orientation positions']:
              st=next(x for x in doc['jobs']['build']['steps'] if x.get('name')==name)
              Path('/tmp/step.sh').write_text(st['run']);subprocess.run(['bash','/tmp/step.sh'],check=True)
          PY
      - name: Add Days to main timing UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/MainActivity.java');s=p.read_text()
          a='private EditText hours,minutes,seconds,millis,totalMs,tapHold,startDelay,targetSize,controlScale,targetOpacity,controlOpacity,hapticStrength;'
          assert a in s;s=s.replace(a,a.replace('hours,','days,hours,'),1)
          a='long hh=saved/3600000,r=saved%3600000,mm=r/60000;\n        r%=60000;long ss=r/1000,mss=r%1000;'
          b='long dd=saved/86400000L,rem=saved%86400000L,hh=rem/3600000L,r=rem%3600000L,mm=r/60000L;\n        r%=60000L;long ss=r/1000L,mss=r%1000L;'
          assert a in s;s=s.replace(a,b,1)
          a='hours=num(hh,4);minutes=num(mm,4);seconds=num(ss,4);millis=num(mss,4);\n        cell(splitRow,hours,"h");cell(splitRow,minutes,"m");cell(splitRow,seconds,"s");cell(splitRow,millis,"ms");'
          b='days=num(dd,4);hours=num(hh,4);minutes=num(mm,4);seconds=num(ss,4);millis=num(mss,4);\n        cell(splitRow,days,"d");cell(splitRow,hours,"h");cell(splitRow,minutes,"m");cell(splitRow,seconds,"s");cell(splitRow,millis,"ms");'
          assert a in s;s=s.replace(a,b,1)
          s=s.replace('splitMode.setText("H / M / S / ms")','splitMode.setText("D / H / M / S / ms")',1)
          a='Math.addExact(Math.multiplyExact(val(hours),3600000L),Math.multiplyExact(val(minutes),60000L)),\n                    Math.addExact(Math.multiplyExact(val(seconds),1000L),val(millis)))'
          b='Math.addExact(Math.multiplyExact(val(days),86400000L),Math.addExact(\n                    Math.addExact(Math.multiplyExact(val(hours),3600000L),Math.multiplyExact(val(minutes),60000L)),\n                    Math.addExact(Math.multiplyExact(val(seconds),1000L),val(millis))))'
          assert a in s;s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Verify final source
        run: |
          M=jump-tapper/app/src/main/java/com/example/robloxjumptapper/MainActivity.java;S=jump-tapper/app/src/main/java/com/example/robloxjumptapper/TapAccessibilityService.java
          grep -F 'days,hours' "$M";grep -F 'cell(splitRow,days,"d")' "$M";grep -F 'D / H / M / S / ms' "$M";grep -F 'onConfigurationChanged' "$S";grep -F 'Jump Tapper v1.62' "$M"
      - name: Build
        working-directory: jump-tapper
        run: gradle assembleRelease
      - name: Verify APK
        run: |
          APK=jump-tapper/app/build/outputs/apk/release/app-release-unsigned.apk;test -s "$APK";unzip -p "$APK" classes.dex | strings | grep -F 'Jump Tapper v1.62';unzip -p "$APK" classes.dex | strings | grep -F 'D / H / M / S / ms';unzip -p "$APK" classes.dex | strings | grep -F '_land';unzip -p "$APK" classes.dex | strings | grep -F '_port'
      - name: Package
        run: |
          mkdir sign-bundle;cp jump-tapper/app/build/outputs/apk/release/app-release-unsigned.apk sign-bundle/JumpTapper_v1.62_unsigned.apk;A=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1);cp "$A" sign-bundle/apksigner;cp "$(dirname "$A")/lib/apksigner.jar" sign-bundle/apksigner.jar
      - uses: actions/upload-artifact@v4
        with: {name: JumpTapper_v1.62_FINAL_SIGNING_BUNDLE, path: sign-bundle}
