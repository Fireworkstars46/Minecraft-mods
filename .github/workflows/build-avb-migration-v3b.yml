name: Build App Volume Buttons Migration v3b

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-avb-migration-v3b.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate v3 source without early icon hiding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-avb-migration-v3.yml')
          text = p.read_text()
          start = "      - name: Create migration helper source\n        run: |\n"
          end = "      - name: Build helper\n"
          block = text.split(start, 1)[1].split(end, 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/create-migration3.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/create-migration3.sh
          sed -i '/^[[:space:]]*hideHelperLauncherIcon();[[:space:]]*$/d' migration3/app/src/main/java/com/garrett/appvolumemigrator/MigrationActivity.java
      - name: Build helper
        working-directory: migration3
        run: gradle --no-daemon assembleRelease
      - name: Collect unsigned helper
        run: |
          mkdir out
          cp migration3/app/build/outputs/apk/release/app-release-unsigned.apk out/App-Volume-Buttons-Migration-v3b-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: avb-migration-v3b-unsigned
          path: out/
