name: Build App Volume Buttons v2.3

on:
  pull_request:
    paths:
      - 'v23parts/**'
      - '.github/workflows/build-app-volume-buttons-v23.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore source
        run: |
          cat v23parts/part00 v23parts/part01 v23parts/part02 v23parts/part03 v23parts/part04 > project.b64
          base64 -d project.b64 > app-volume-buttons-v23-source.zip
          echo 'a51c26ea64e7b7219147fe709d83829be057069412a8dee9e2411969cf5fa773  app-volume-buttons-v23-source.zip' | sha256sum -c -
          mkdir v23build
          unzip -q app-volume-buttons-v23-source.zip -d v23build
          grep -q "versionName '2.3'" v23build/app/build.gradle
          grep -q 'event.getRepeatCount() > 0' v23build/app/src/main/java/com/garrett/appvolumestepper/VolumeKeyService.java
          grep -q 'COMMAND_CACHE_MS = 1200L' v23build/app/src/main/java/com/garrett/appvolumestepper/SamsungAppVolumeManager.java
      - name: Build unsigned release APK
        working-directory: v23build
        run: gradle --no-daemon assembleRelease
      - name: Prepare artifact
        run: |
          cp v23build/app/build/outputs/apk/release/app-release-unsigned.apk App-Volume-Buttons-v2.3-unsigned.apk
          sha256sum App-Volume-Buttons-v2.3-unsigned.apk > App-Volume-Buttons-v2.3-unsigned-checksum.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Volume-Buttons-v2.3-unsigned
          path: |
            App-Volume-Buttons-v2.3-unsigned.apk
            App-Volume-Buttons-v2.3-unsigned-checksum.txt
