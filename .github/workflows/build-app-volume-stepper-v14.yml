name: Build App Volume Stepper v1.4
on:
  push:
    branches: [app-volume-stepper-v14-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: app-volume-stepper-v14
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: App-Volume-Stepper-v1.4
          path: app-volume-stepper-v14/app/build/outputs/apk/debug/app-debug.apk
