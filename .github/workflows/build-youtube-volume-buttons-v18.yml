name: Build YouTube Volume Buttons v1.8

on:
  pull_request:
    paths:
      - 'youtube-volume-buttons-v18-source.zip.b64'
      - '.github/workflows/build-youtube-volume-buttons-v18.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore source
        run: |
          base64 -d youtube-volume-buttons-v18-source.zip.b64 > source.zip
          sha256sum source.zip
          unzip -t source.zip
          unzip -q source.zip
          test -f v18src/app/src/main/java/com/garrett/appvolumestepper/VolumeStepperService.java

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: v18src
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Prepare outputs
        if: always()
        run: |
          if [ -f v18src/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp v18src/app/build/outputs/apk/debug/app-debug.apk YouTube-Volume-Buttons-v1.8.apk
          fi
          cp v18src/build.log youtube-volume-buttons-v1.8-build.log || true

      - name: Upload APK
        if: hashFiles('YouTube-Volume-Buttons-v1.8.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Volume-Buttons-v1.8
          path: YouTube-Volume-Buttons-v1.8.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Volume-Buttons-v1.8-build-log
          path: youtube-volume-buttons-v1.8-build.log

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
