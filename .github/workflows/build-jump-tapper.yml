name: Build Jump Tapper APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: jump-tapper
        run: gradle assembleRelease
      - name: Package unsigned APK and apksigner tool
        run: |
          mkdir sign-bundle
          cp jump-tapper/app/build/outputs/apk/release/app-release-unsigned.apk sign-bundle/JumpTapper_v1.11_unsigned.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APKSIGNER_DIR=$(dirname "$APKSIGNER")
          cp "$APKSIGNER" sign-bundle/apksigner
          cp "$APKSIGNER_DIR/lib/apksigner.jar" sign-bundle/apksigner.jar
      - name: Upload signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: JumpTapper_v1.11_SIGNING_BUNDLE
          path: sign-bundle
          if-no-files-found: error
