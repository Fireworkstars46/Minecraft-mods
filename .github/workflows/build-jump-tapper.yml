name: Build Jump Tapper APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.39 settings close fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep v1.38's normal Android settings window (the Samsung keyboard/nav fix),
          # but make SET a true open/close toggle and add a dedicated CLOSE button.
          p=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/TapAccessibilityService.java')
          s=p.read_text()
          s=s.replace('topRow.addView(menu,new LinearLayout.LayoutParams(scaled(46),scaled(46)));','topRow.addView(menu,new LinearLayout.LayoutParams(scaled(36),scaled(46)));',1)
          s=s.replace('masterOverlayButton=smallButton(masterEnabled?"ON":"OFF",58);','masterOverlayButton=smallButton(masterEnabled?"ON":"OFF",46);',1)
          s=s.replace('startStop=smallButton("START",80);','startStop=smallButton("START",62);',1)
          s=s.replace('moveButton=smallButton(moveMode?"LOCK":"MOVE",66);','moveButton=smallButton(moveMode?"LOCK":"MOVE",52);',1)
          s=s.replace('tapButton=smallButton("TAP",54);','tapButton=smallButton("TAP",44);',1)
          s=s.replace('targetButton=smallButton("J",42);','targetButton=smallButton("J",34);',1)
          old='settingsButton=smallButton("SET",54);settingsButton.setOnClickListener(v->setSettingsOpen(!settingsOpen));'
          new='settingsButton=smallButton("SET",44);settingsButton.setOnClickListener(v->{Intent si=new Intent(this,OverlaySettingsActivity.class);si.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);startActivity(si);});'
          if old not in s: raise SystemExit('SET listener marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Dedicated normal Activity. Pressing the floating SET button again while this
          # dialog is foreground brings the same singleTop instance forward; onNewIntent
          # interprets that as the requested toggle-close. CLOSE saves then finishes.
          a=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/OverlaySettingsActivity.java')
          a.write_text('''package com.example.robloxjumptapper;\n\nimport android.content.Intent;\nimport android.os.Bundle;\nimport android.view.View;\nimport android.view.ViewGroup;\nimport android.view.WindowManager;\nimport android.widget.Button;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\n\npublic class OverlaySettingsActivity extends MainActivity {\n    @Override protected void onCreate(Bundle b){\n        super.onCreate(b);\n        getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);\n        setTitle("Jump Tapper Settings");\n        addCloseButton();\n    }\n    private void addCloseButton(){\n        View content=findViewById(android.R.id.content);\n        if(!(content instanceof ViewGroup))return;\n        View root=((ViewGroup)content).getChildAt(0);\n        if(root instanceof ScrollView){\n            View child=((ScrollView)root).getChildAt(0);\n            if(child instanceof LinearLayout){\n                Button close=new Button(this);\n                close.setText("CLOSE SETTINGS");\n                close.setOnClickListener(v->{saveForClose();finish();});\n                ((LinearLayout)child).addView(close,new LinearLayout.LayoutParams(-1,dpForClose(54)));\n            }\n        }\n    }\n    private int dpForClose(int v){return Math.round(v*getResources().getDisplayMetrics().density);}\n    private void saveForClose(){\n        // Reuse MainActivity's existing Save Settings button so no setting logic is duplicated.\n        View content=findViewById(android.R.id.content);\n        if(!(content instanceof ViewGroup))return;\n        View root=((ViewGroup)content).getChildAt(0);\n        if(!(root instanceof ScrollView))return;\n        View child=((ScrollView)root).getChildAt(0);\n        if(!(child instanceof LinearLayout))return;\n        LinearLayout box=(LinearLayout)child;\n        for(int i=0;i<box.getChildCount();i++){\n            View v=box.getChildAt(i);\n            if(v instanceof Button && "Save Settings".contentEquals(((Button)v).getText())){v.performClick();break;}\n        }\n    }\n    @Override protected void onNewIntent(Intent intent){\n        super.onNewIntent(intent);\n        // SET again = close, matching the old overlay behavior.\n        finish();\n    }\n}\n''')

          manifest=Path('jump-tapper/app/src/main/AndroidManifest.xml')
          ms=manifest.read_text()
          marker='''        <activity\n            android:name=".MainActivity"\n            android:exported="true">'''
          addition='''        <activity\n            android:name=".OverlaySettingsActivity"\n            android:exported="false"\n            android:excludeFromRecents="true"\n            android:launchMode="singleTop"\n            android:theme="@android:style/Theme.Material.Dialog.NoActionBar"\n            android:windowSoftInputMode="adjustResize" />\n\n'''
          if marker not in ms: raise SystemExit('manifest activity marker not found')
          manifest.write_text(ms.replace(marker,addition+marker,1))

          m=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/MainActivity.java')
          text=m.read_text()
          text=text.replace('TextView title=text("Jump Tapper v1.31",28,true);','TextView title=text("Jump Tapper v1.39",28,true);',1)
          text=text.replace('totalMs=num(saved,8);','totalMs=num(saved,8);totalMs.setOnFocusChangeListener((v,has)->{if(has){totalMode.setChecked(true);showTiming(true);}});',1)
          splitmarker='cell(splitRow,hours,"h");cell(splitRow,minutes,"m");cell(splitRow,seconds,"s");cell(splitRow,millis,"ms");'
          splitrepl=splitmarker+'\n        View.OnFocusChangeListener sf=(v,has)->{if(has){splitMode.setChecked(true);showTiming(false);}};hours.setOnFocusChangeListener(sf);minutes.setOnFocusChangeListener(sf);seconds.setOnFocusChangeListener(sf);millis.setOnFocusChangeListener(sf);'
          if splitmarker not in text: raise SystemExit('split timing marker not found')
          text=text.replace(splitmarker,splitrepl,1)
          reloadmarker='        Intent reload=new Intent(ACTION_RELOAD);reload.setPackage(getPackageName());sendBroadcast(reload);\n        requestMaster();'
          reloadrepl='        Intent reload=new Intent(ACTION_RELOAD);reload.setPackage(getPackageName());sendBroadcast(reload);\n        getSharedPreferences(PREFS,MODE_PRIVATE).edit().putInt("last_ui_build",42).apply();\n        new Handler(Looper.getMainLooper()).postDelayed(()->{Intent reloadLater=new Intent(ACTION_RELOAD);reloadLater.setPackage(getPackageName());sendBroadcast(reloadLater);requestMaster();},700L);\n        requestMaster();'
          if reloadmarker not in text: raise SystemExit('reload marker not found')
          m.write_text(text.replace(reloadmarker,reloadrepl,1))

          g=Path('jump-tapper/app/build.gradle')
          original=g.read_text()
          t=original.replace("versionCode 35\n        versionName '1.32'","versionCode 42\n        versionName '1.39'")
          if t==original: raise SystemExit('version marker not found')
          g.write_text(t)
          PY
      - name: Build unsigned release APK
        working-directory: jump-tapper
        run: gradle assembleRelease
      - name: Package unsigned APK and apksigner tool
        run: |
          mkdir sign-bundle
          cp jump-tapper/app/build/outputs/apk/release/app-release-unsigned.apk sign-bundle/JumpTapper_v1.39_unsigned.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APKSIGNER_DIR=$(dirname "$APKSIGNER")
          cp "$APKSIGNER" sign-bundle/apksigner
          cp "$APKSIGNER_DIR/lib/apksigner.jar" sign-bundle/apksigner.jar
      - name: Upload signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: JumpTapper_v1.39_SIGNING_BUNDLE
          path: sign-bundle
          if-no-files-found: error
