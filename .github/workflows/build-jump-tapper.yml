name: Build Jump Tapper APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.34 overlay and keyboard fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/TapAccessibilityService.java')
          s=p.read_text()
          replacements={
            'topRow.addView(menu,new LinearLayout.LayoutParams(scaled(46),scaled(46)));':'topRow.addView(menu,new LinearLayout.LayoutParams(scaled(36),scaled(46)));',
            'masterOverlayButton=smallButton(masterEnabled?"ON":"OFF",58);':'masterOverlayButton=smallButton(masterEnabled?"ON":"OFF",46);',
            'startStop=smallButton("START",80);':'startStop=smallButton("START",62);',
            'moveButton=smallButton(moveMode?"LOCK":"MOVE",66);':'moveButton=smallButton(moveMode?"LOCK":"MOVE",52);',
            'tapButton=smallButton("TAP",54);':'tapButton=smallButton("TAP",44);',
            'targetButton=smallButton("J",42);':'targetButton=smallButton("J",34);',
            'settingsButton=smallButton("SET",54);':'settingsButton=smallButton("SET",44);',
            'int maxW=(int)(getResources().getDisplayMetrics().widthPixels*0.90f);int maxH=(int)(getResources().getDisplayMetrics().heightPixels*0.72f);':'int maxW=(int)(getResources().getDisplayMetrics().widthPixels*0.96f);int maxH=(int)(getResources().getDisplayMetrics().heightPixels*0.60f);',
            'WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,PixelFormat.TRANSLUCENT);controlParams.gravity':'WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT);controlParams.gravity',
            'private EditText overlayNumber(long value,int len){EditText e=new EditText(this);e.setText(String.valueOf(value));e.setTextColor(Color.WHITE);e.setHintTextColor(0xFFAAAAAA);e.setTextSize(14);e.setGravity(Gravity.CENTER);e.setSingleLine(true);e.setSelectAllOnFocus(true);e.setInputType(InputType.TYPE_CLASS_NUMBER);e.setFilters(new InputFilter[]{new InputFilter.LengthFilter(len)});return e;}':'private EditText overlayNumber(long value,int len){EditText e=new EditText(this);e.setText(String.valueOf(value));e.setTextColor(Color.WHITE);e.setHintTextColor(0xFFAAAAAA);e.setTextSize(14);e.setGravity(Gravity.CENTER);e.setSingleLine(true);e.setSelectAllOnFocus(true);e.setInputType(InputType.TYPE_CLASS_NUMBER);e.setImeOptions(android.view.inputmethod.EditorInfo.IME_ACTION_DONE);e.setFilters(new InputFilter[]{new InputFilter.LengthFilter(len)});e.setOnEditorActionListener((v,action,event)->{if(action==android.view.inputmethod.EditorInfo.IME_ACTION_DONE){android.view.inputmethod.InputMethodManager im=(android.view.inputmethod.InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);if(im!=null)im.hideSoftInputFromWindow(e.getWindowToken(),0);e.clearFocus();return true;}return false;});return e;}',
            'if(open){collapsed=false;if(buttons!=null)buttons.setVisibility(View.VISIBLE);syncOverlayFields();if(controlParams!=null){controlParams.flags&=~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;try{wm.updateViewLayout(control,controlParams);}catch(Exception ignored){}}}':'if(open){collapsed=false;if(buttons!=null)buttons.setVisibility(View.VISIBLE);syncOverlayFields();if(controlParams!=null){controlParams.flags&=~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;controlParams.flags&=~WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN;int screenH=getResources().getDisplayMetrics().heightPixels;int safeBottom=dp(96);int top=Math.max(0,controlParams.y);int rowH=scaled(46);int available=Math.max(dp(220),screenH-top-rowH-safeBottom);if(settingsScroll!=null){android.view.ViewGroup.LayoutParams lp=settingsScroll.getLayoutParams();lp.height=Math.min((int)(screenH*0.60f),available);settingsScroll.setLayoutParams(lp);}try{wm.updateViewLayout(control,controlParams);}catch(Exception ignored){}}}',
            'else if(controlParams!=null){controlParams.flags|=WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;try{wm.updateViewLayout(control,controlParams);}catch(Exception ignored){}}':'else if(controlParams!=null){android.view.inputmethod.InputMethodManager im=(android.view.inputmethod.InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);if(im!=null&&control!=null)im.hideSoftInputFromWindow(control.getWindowToken(),0);if(control!=null)control.clearFocus();controlParams.flags|=WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;try{wm.updateViewLayout(control,controlParams);}catch(Exception ignored){}}'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected source text not found: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s)
          g=Path('jump-tapper/app/build.gradle')
          original=g.read_text()
          t=original.replace("versionCode 35\n        versionName '1.32'","versionCode 37\n        versionName '1.34'")
          if t==original: raise SystemExit('Version text not found')
          g.write_text(t)
          PY
      - name: Build unsigned release APK
        working-directory: jump-tapper
        run: gradle assembleRelease
      - name: Package unsigned APK and apksigner tool
        run: |
          mkdir sign-bundle
          cp jump-tapper/app/build/outputs/apk/release/app-release-unsigned.apk sign-bundle/JumpTapper_v1.34_unsigned.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APKSIGNER_DIR=$(dirname "$APKSIGNER")
          cp "$APKSIGNER" sign-bundle/apksigner
          cp "$APKSIGNER_DIR/lib/apksigner.jar" sign-bundle/apksigner.jar
      - name: Upload signing bundle
        uses: actions/upload-artifact@v4
        with:
          name: JumpTapper_v1.34_SIGNING_BUNDLE
          path: sign-bundle
          if-no-files-found: error
