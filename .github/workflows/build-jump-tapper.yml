name: Build Jump Tapper APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: jump-tapper
        run: gradle assembleRelease

      - name: Rename APK
        run: cp jump-tapper/app/build/outputs/apk/release/app-release-unsigned.apk JumpTapper_v1.5_unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JumpTapper_v1.5_UNSIGNED_APK
          path: JumpTapper_v1.5_unsigned.apk
          if-no-files-found: error
