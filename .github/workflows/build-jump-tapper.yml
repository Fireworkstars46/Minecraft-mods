name: Build Jump Tapper APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply v1.49 Samsung keyboard layering fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/TapAccessibilityService.java');s=p.read_text()
          for old,new in [('topRow.addView(menu,new LinearLayout.LayoutParams(scaled(46),scaled(46)));','topRow.addView(menu,new LinearLayout.LayoutParams(scaled(36),scaled(46)));'),('masterOverlayButton=smallButton(masterEnabled?"ON":"OFF",58);','masterOverlayButton=smallButton(masterEnabled?"ON":"OFF",46);'),('startStop=smallButton("START",80);','startStop=smallButton("START",62);'),('moveButton=smallButton(moveMode?"LOCK":"MOVE",66);','moveButton=smallButton(moveMode?"LOCK":"MOVE",52);'),('tapButton=smallButton("TAP",54);','tapButton=smallButton("TAP",44);'),('targetButton=smallButton("J",42);','targetButton=smallButton("J",34);')]: s=s.replace(old,new,1)
          old='settingsButton=smallButton("SET",54);settingsButton.setOnClickListener(v->setSettingsOpen(!settingsOpen));';new='settingsButton=smallButton("SET",44);settingsButton.setOnClickListener(v->setSettingsOpen(!settingsOpen));'
          if old not in s: raise SystemExit('SET marker missing')
          s=s.replace(old,new,1)
          oldcp='controlParams=new WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT,WindowManager.LayoutParams.WRAP_CONTENT,WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE|WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,PixelFormat.TRANSLUCENT);'
          newcp='int controlWindowType=android.provider.Settings.canDrawOverlays(this)?WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY:WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY;controlParams=new WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT,WindowManager.LayoutParams.WRAP_CONTENT,controlWindowType,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT);'
          if oldcp not in s: raise SystemExit('control params marker missing')
          s=s.replace(oldcp,newcp,1).replace('settingsContent.setPadding(dp(8),dp(6),dp(8),dp(12));','settingsContent.setPadding(dp(8),0,dp(8),dp(12));',1)
          oldset='''    private void setSettingsOpen(boolean open){\n        settingsOpen=open;if(settingsScroll!=null)settingsScroll.setVisibility(open?View.VISIBLE:View.GONE);\n        if(open){collapsed=false;if(buttons!=null)buttons.setVisibility(View.VISIBLE);syncOverlayFields();if(controlParams!=null){controlParams.flags&=~WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;try{wm.updateViewLayout(control,controlParams);}catch(Exception ignored){}}}\n        else if(controlParams!=null){controlParams.flags|=WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;try{wm.updateViewLayout(control,controlParams);}catch(Exception ignored){}}\n    }'''
          newset='''    private void setSettingsOpen(boolean open){\n        settingsOpen=open;if(settingsScroll!=null)settingsScroll.setVisibility(open?View.VISIBLE:View.GONE);\n        if(open){collapsed=false;if(buttons!=null)buttons.setVisibility(View.VISIBLE);syncOverlayFields();}\n        if(controlParams!=null){controlParams.flags|=WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE;try{wm.updateViewLayout(control,controlParams);}catch(Exception ignored){}}\n    }'''
          if oldset not in s: raise SystemExit('settings focus marker missing')
          s=s.replace(oldset,newset,1)
          oldnum='private EditText overlayNumber(long value,int len){EditText e=new EditText(this);e.setText(String.valueOf(value));e.setTextColor(Color.WHITE);e.setHintTextColor(0xFFAAAAAA);e.setTextSize(14);e.setGravity(Gravity.CENTER);e.setSingleLine(true);e.setSelectAllOnFocus(true);e.setInputType(InputType.TYPE_CLASS_NUMBER);e.setFilters(new InputFilter[]{new InputFilter.LengthFilter(len)});return e;}'
          newnum='private EditText overlayNumber(long value,int len){EditText e=new EditText(this);e.setText(String.valueOf(value));e.setTextColor(Color.WHITE);e.setHintTextColor(0xFFAAAAAA);e.setTextSize(14);e.setGravity(Gravity.CENTER);e.setSingleLine(true);e.setFocusable(false);e.setFocusableInTouchMode(false);e.setCursorVisible(false);e.setInputType(InputType.TYPE_NULL);e.setFilters(new InputFilter[]{new InputFilter.LengthFilter(len)});e.setOnClickListener(v->openPhoneKeyboardEditor(e,len));return e;}'
          if oldnum not in s: raise SystemExit('overlayNumber marker missing')
          s=s.replace(oldnum,newnum,1)
          anchor='    private LinearLayout settingRow(String label,EditText field)'
          helper='''    private void openPhoneKeyboardEditor(EditText e,int len){\n        try{\n            // Hide only the large settings body before the normal IME Activity opens. Keep the top control row visible.\n            if(settingsScroll!=null)settingsScroll.setVisibility(View.GONE);\n            Intent i=new Intent(this,NumberInputActivity.class);i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_NO_ANIMATION);\n            i.putExtra("value",e.getText().toString());i.putExtra("max_len",len);\n            String token="num_"+SystemClock.uptimeMillis();i.putExtra("token",token);\n            BroadcastReceiver r=new BroadcastReceiver(){@Override public void onReceive(Context c,Intent x){if(!token.equals(x.getStringExtra("token")))return;String v=x.getStringExtra("value");if(v!=null)e.setText(v);if(settingsOpen&&settingsScroll!=null)settingsScroll.setVisibility(View.VISIBLE);try{unregisterReceiver(this);}catch(Exception ignored){}}};\n            IntentFilter f=new IntentFilter("com.example.robloxjumptapper.NUMBER_RESULT");if(Build.VERSION.SDK_INT>=33)registerReceiver(r,f,Context.RECEIVER_NOT_EXPORTED);else registerReceiver(r,f);startActivity(i);\n        }catch(Exception ex){if(settingsOpen&&settingsScroll!=null)settingsScroll.setVisibility(View.VISIBLE);toast("Could not open phone keyboard");}\n    }\n\n'''
          if anchor not in s: raise SystemExit('setting row marker missing')
          s=s.replace(anchor,helper+anchor,1)
          p.write_text(s)
          a=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/NumberInputActivity.java')
          a.write_text('''package com.example.robloxjumptapper;\n\nimport android.app.*;import android.os.*;import android.content.*;import android.graphics.Color;import android.text.InputFilter;import android.view.*;import android.view.inputmethod.InputMethodManager;import android.widget.*;\n\npublic class NumberInputActivity extends Activity{\n private EditText field;private String token;private boolean sent=false;\n private int dp(int n){return (int)(n*getResources().getDisplayMetrics().density+.5f);}\n @Override protected void onCreate(Bundle b){super.onCreate(b);overridePendingTransition(0,0);token=getIntent().getStringExtra("token");int max=Math.max(1,getIntent().getIntExtra("max_len",8));\n  LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setPadding(dp(14),dp(8),dp(14),dp(8));root.setBackgroundColor(0xFF303134);\n  field=new EditText(this);field.setText(getIntent().getStringExtra("value"));field.setTextColor(Color.WHITE);field.setTextSize(20);field.setSingleLine(true);field.setSelectAllOnFocus(true);field.setInputType(android.text.InputType.TYPE_CLASS_NUMBER|android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL);field.setFilters(new InputFilter[]{new InputFilter.LengthFilter(max)});field.setImeOptions(android.view.inputmethod.EditorInfo.IME_ACTION_DONE);root.addView(field,new LinearLayout.LayoutParams(-1,dp(52)));\n  LinearLayout row=new LinearLayout(this);Button cancel=new Button(this);cancel.setText("CANCEL");cancel.setOnClickListener(v->cancelAndClose());row.addView(cancel,new LinearLayout.LayoutParams(0,dp(44),1));Button done=new Button(this);done.setText("DONE");done.setOnClickListener(v->save());row.addView(done,new LinearLayout.LayoutParams(0,dp(44),1));root.addView(row);setContentView(root);\n  Window w=getWindow();w.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE|WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_VISIBLE);w.setNavigationBarColor(Color.BLACK);WindowManager.LayoutParams lp=w.getAttributes();lp.width=(int)(getResources().getDisplayMetrics().widthPixels*.90f);lp.height=WindowManager.LayoutParams.WRAP_CONTENT;lp.gravity=Gravity.BOTTOM|Gravity.CENTER_HORIZONTAL;lp.y=dp(8);w.setAttributes(lp);\n  field.setOnEditorActionListener((v,id,e)->{if(id==android.view.inputmethod.EditorInfo.IME_ACTION_DONE){save();return true;}return false;});field.requestFocus();field.postDelayed(()->{InputMethodManager im=(InputMethodManager)getSystemService(INPUT_METHOD_SERVICE);if(im!=null)im.showSoftInput(field,InputMethodManager.SHOW_IMPLICIT);},150);\n }\n private void send(String value){if(sent)return;sent=true;Intent r=new Intent("com.example.robloxjumptapper.NUMBER_RESULT");r.setPackage(getPackageName());r.putExtra("token",token);r.putExtra("value",value);sendBroadcast(r);}\n private void save(){send(field.getText().toString());finish();}\n private void cancelAndClose(){send(null);finish();}\n @Override public void onBackPressed(){cancelAndClose();}\n @Override public void finish(){if(!sent)send(null);super.finish();overridePendingTransition(0,0);}\n}\n''')
          mf=Path('jump-tapper/app/src/main/AndroidManifest.xml');ms=mf.read_text().replace('<uses-permission android:name="android.permission.VIBRATE" />','<uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',1)
          app='''        <activity android:name=".NumberInputActivity" android:exported="false" android:excludeFromRecents="true" android:theme="@android:style/Theme.Material.Dialog.NoActionBar" android:windowSoftInputMode="adjustResize" />\n''';pos=ms.rfind('</application>');ms=ms[:pos]+app+ms[pos:];mf.write_text(ms)
          m=Path('jump-tapper/app/src/main/java/com/example/robloxjumptapper/MainActivity.java');t=m.read_text().replace('TextView title=text("Jump Tapper v1.31",28,true);','TextView title=text("Jump Tapper v1.49",28,true);',1)
          marker='        SharedPreferences p=getSharedPreferences(PREFS,MODE_PRIVATE);\n        migrate(p);';repl='        SharedPreferences p=getSharedPreferences(PREFS,MODE_PRIVATE);\n        migrate(p);\n        if(Build.VERSION.SDK_INT>=23&&!Settings.canDrawOverlays(this)&&!p.getBoolean("overlay_permission_prompted",false)){p.edit().putBoolean("overlay_permission_prompted",true).apply();try{startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:"+getPackageName())));}catch(Exception ignored){}}'
          if marker not in t: raise SystemExit('permission marker missing')
          t=t.replace(marker,repl,1)
          rm='        Intent reload=new Intent(ACTION_RELOAD);reload.setPackage(getPackageName());sendBroadcast(reload);\n        requestMaster();';rr='        Intent reload=new Intent(ACTION_RELOAD);reload.setPackage(getPackageName());sendBroadcast(reload);\n        getSharedPreferences(PREFS,MODE_PRIVATE).edit().putInt("last_ui_build",52).apply();\n        new Handler(Looper.getMainLooper()).postDelayed(()->{Intent reloadLater=new Intent(ACTION_RELOAD);reloadLater.setPackage(getPackageName());sendBroadcast(reloadLater);requestMaster();},700L);\n        requestMaster();'
          if rm not in t: raise SystemExit('reload marker missing')
          t=t.replace(rm,rr,1);insert='''\n    @Override public void onWindowFocusChanged(boolean hasFocus){super.onWindowFocusChanged(hasFocus);if(hasFocus&&(Build.VERSION.SDK_INT<23||Settings.canDrawOverlays(this))){Intent reload=new Intent(ACTION_RELOAD);reload.setPackage(getPackageName());sendBroadcast(reload);}}\n''';idx=t.rfind('\n}');t=t[:idx]+insert+t[idx:];m.write_text(t)
          g=Path('jump-tapper/app/build.gradle');x=g.read_text();y=x.replace("versionCode 35\n        versionName '1.32'","versionCode 52\n        versionName '1.49'");
          if y==x: raise SystemExit('version marker missing')
          g.write_text(y)
          PY
      - name: Build unsigned release APK
        working-directory: jump-tapper
        run: gradle assembleRelease
      - name: Package unsigned APK and apksigner tool
        run: |
          mkdir sign-bundle
          cp jump-tapper/app/build/outputs/apk/release/app-release-unsigned.apk sign-bundle/JumpTapper_v1.49_unsigned.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          cp "$APKSIGNER" sign-bundle/apksigner
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" sign-bundle/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: JumpTapper_v1.49_SIGNING_BUNDLE
          path: sign-bundle
          if-no-files-found: error
