name: Build App Volume Buttons migration

on:
  pull_request:
    paths:
      - '.github/workflows/build-app-volume-buttons-migration.yml'
      - 'migration-helper-source-part*'

jobs:
  build-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reassemble helper source
        run: |
          cat migration-helper-source-part* > migration-helper-source.zip.b64
          base64 -d migration-helper-source.zip.b64 > migration-helper-source.zip
          mkdir helper
          unzip -q migration-helper-source.zip -d helper
          test -f helper/app/src/main/assets/App-Volume-Buttons-v2.4.apk
      - name: Build migration helper
        working-directory: helper
        run: gradle --no-daemon assembleRelease
      - name: Prepare artifact
        run: |
          cp helper/app/build/outputs/apk/release/app-release-unsigned.apk App-Volume-Buttons-Migration-unsigned.apk
          unzip -t App-Volume-Buttons-Migration-unsigned.apk
          sha256sum App-Volume-Buttons-Migration-unsigned.apk > App-Volume-Buttons-Migration-unsigned-checksum.txt
      - uses: actions/upload-artifact@v4
        with:
          name: App-Volume-Buttons-Migration-unsigned
          path: |
            App-Volume-Buttons-Migration-unsigned.apk
            App-Volume-Buttons-Migration-unsigned-checksum.txt
